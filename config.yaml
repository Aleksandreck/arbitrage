# === Список бирж для сравнения ===
# id — должен совпадать с идентификатором в библиотеке ccxt (binance, bybit, okx, kucoin...)
# fee_pct — комиссия за сделку в процентах (taker fee). Значение по умолчанию ~0.1%
exchanges:
  - id: binance
    fee_pct: 0.1
  - id: bybit
    fee_pct: 0.1

# === Параметры фильтрации ===
# Котируемая валюта: сравниваем только пары, оканчивающиеся на неё (BTC/USDT, ETH/USDT...)
quote: USDT

# Минимальная чистая прибыль в процентах (после вычета комиссий), чтобы попасть в вывод
min_net_profit_pct: 0.05

# Сколько строк максимум вывести в консоль
limit: 20

# Если список пустой — рассматриваем все пары.
# Если заполнен — только эти символы.
symbols_whitelist: []
# Пример заполнения:
# symbols_whitelist:
#   - BTC/USDT
#   - ETH/USDT
